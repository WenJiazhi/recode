name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check documentation and config files
        run: bun run check:docs

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test built CLI
        run: bun run test:smoke

      - name: Test Provider protocols end to end
        run: bun run test:provider-e2e

      - name: Test ACP end to end
        run: bun run test:acp-e2e
