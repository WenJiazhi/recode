name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run health checks
        run: bun run health

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: recode-darwin-arm64
          - runner: macos-15-intel
            asset: recode-darwin-x64
          - runner: ubuntu-latest
            asset: recode-linux-x64
          - runner: ubuntu-24.04-arm
            asset: recode-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        run: bun run build:binary

      - name: Smoke test binary
        shell: bash
        run: |
          ./dist/recode --version
          ./dist/recode-rg --version | grep 'ripgrep'
          ./dist/recode --help | grep 'Usage: recode'
          ./dist/recode -p '/doctor' > binary-doctor.txt
          grep 'Installation type: native' binary-doctor.txt
          grep 'Governed optional capabilities:' binary-doctor.txt

      - name: Test Provider protocols in binary
        run: >-
          bun run scripts/provider-e2e.ts
          --runtimes binary
          --binary ./dist/recode

      - name: Test ACP protocol in binary
        run: >-
          bun run scripts/acp-e2e.ts
          --runtimes binary
          --binary ./dist/recode

      - name: Package binary
        shell: bash
        run: tar -czf "${{ matrix.asset }}.tar.gz" -C dist recode recode-rg

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.tar.gz
          release-assets/checksums.txt
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
